[package]
name = "kavychka-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
kavychka-core = { path = "../core" }
kavychka-storage = { path = "../storage" }
kavychka-platform = { path = "../platform" }
kavychka-maintenance = { path = "../maintenance" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030", "raw-window-handle-06", "system-tray"] }
raw-window-handle = "=0.6.2"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
tempfile.workspace = true
