[package]
name = "kavychka-maintenance"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
kavychka-core = { path = "../core" }
kavychka-storage = { path = "../storage" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
chrono.workspace = true
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true

[[bin]]
name = "Kavychka"
path = "src/main.rs"
