[workspace]
members = ["crates/core", "crates/storage", "crates/cli", "crates/design-preview", "crates/app", "crates/platform", "crates/maintenance"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = { version = "=0.4.45", features = ["serde"] }
thiserror = "=2.0.21"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
