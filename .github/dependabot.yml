version: 2
updates:
  - package-ecosystem: cargo
    directory: /next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # pip is intentionally not listed: Python dependencies in backend/ are pinned to
  # match the model runtimes (Torch, SciPy, Transformers, ...) and are updated by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
