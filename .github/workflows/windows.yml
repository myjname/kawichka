name: Windows build and release

on:
  push:
    branches: [main, release-candidate]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test helpers (no inference runtime or models)
        run: python -m pip install -r tests/requirements.txt
      - name: Check public source selection
        run: python -B scripts/check-public.py
      - name: Build and exercise Windows app, installer and local service
        shell: pwsh
        run: ./scripts/test.ps1 -Python (Get-Command python).Source

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and verify release payload
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $version = [Reflection.AssemblyName]::GetAssemblyName((Join-Path $PWD 'outputs/Kavychka/Kavychka.exe')).Version
          if ([Version]$env:RELEASE_TAG.TrimStart('v') -ne [Version]$version.ToString(3)) { throw 'Tag does not match the application version' }
          python -B -m unittest discover -s tests -p test_package.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Payload verification failed' }
          $lines = foreach ($name in @('Kavychka-Setup.exe','Kavychka-portable.zip')) {
            $hash = (Get-FileHash -LiteralPath (Join-Path 'outputs' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'outputs/SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))
      - name: Publish verified installer and portable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG outputs/Kavychka-Setup.exe outputs/Kavychka-portable.zip outputs/SHA256SUMS.txt --verify-tag --title "Kavychka $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
