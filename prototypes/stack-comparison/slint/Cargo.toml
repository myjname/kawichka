[package]
name = "quote-slint"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030", "raw-window-handle-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
